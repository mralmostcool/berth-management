spring:

  application:
    name: mrcool-berth

  datasource:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

server:
  port: 8080

logging:
  level:
    org.flywaydb: DEBUG
    org.hibernate.SQL: WARN
    io.github.cdimascio: DEBUG


management:
  endpoints:
    web:
      exposure:
        include: "mapping,health,scalar"

scalar:
  enabled: true
  url: "/v3/api-docs"
  theme: "deepSpace"
  layout: "modern"
  documentDownloadType: "both"
  actuatorEnabled: true
